services:
  todo-api:
    container_name: todo-api
    image: ${DOCKERHUB_USERNAME}/todo-api:${TAG}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: todo-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER in /srv/todo/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in /srv/todo/.env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in /srv/todo/.env}
    ports:
      - "3000:3000"
    depends_on:
      todo-db:
        condition: service_healthy
    restart: unless-stopped

  todo-db:
    container_name: todo-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in /srv/todo/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in /srv/todo/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in /srv/todo/.env}
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - todo-api
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in /srv/todo/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in /srv/todo/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  todo-db-data:
  prometheus-data:
  grafana-data:
