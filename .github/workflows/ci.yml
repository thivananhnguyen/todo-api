name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: todo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Todo API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false

      - name: Build Todo Stats API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./stats_api
          file: ./stats_api/Dockerfile
          push: false

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Todo API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}

      - name: Build and push Todo Stats API image
        uses: docker/build-push-action@v6
        with:
          context: ./stats_api
          file: ./stats_api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-stats-api:${{ github.sha }}

  self-hosted-smoke:
    name: self-hosted-smoke
    runs-on: self-hosted
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Show runner hostname
        run: hostname

      - name: Show Docker visibility on runner
        run: docker ps -a --filter "name=vm-prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  deploy-vm-prod:
    name: deploy-vm-prod
    runs-on: self-hosted
    needs: [build-and-push, self-hosted-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load deploy key into SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deployment folder on target
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /srv/todo"

      - name: Upload deployment compose file
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/compose.yml"

      - name: Validate target .env file
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            test -f /srv/todo/.env || { echo "Missing /srv/todo/.env on target"; exit 1; }
            grep -q "^DB_USER=" /srv/todo/.env || { echo "Missing DB_USER in /srv/todo/.env"; exit 1; }
            grep -q "^DB_PASSWORD=" /srv/todo/.env || { echo "Missing DB_PASSWORD in /srv/todo/.env"; exit 1; }
            grep -q "^DB_NAME=" /srv/todo/.env || { echo "Missing DB_NAME in /srv/todo/.env"; exit 1; }
          '

      - name: Deploy images on vm-prod
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /srv/todo
            TAG=${{ github.sha }} DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose -f compose.yml up -d
          '

      - name: Verify deployment health
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            if command -v curl >/dev/null 2>&1; then
              curl --retry 20 --retry-all-errors --retry-delay 1 -f http://localhost:3000/health
            elif command -v wget >/dev/null 2>&1; then
              i=1
              until wget -q --spider -T 2 http://localhost:3000/health; do
                if [ "$i" -ge 20 ]; then
                  echo "Health check failed after 20 attempts"
                  exit 1
                fi
                i=$((i + 1))
                sleep 1
              done
            else
              echo "Neither curl nor wget is installed on target host"
              exit 127
            fi
          '
