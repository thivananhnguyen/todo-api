name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: todo_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Todo API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}

      - name: Build and push Todo Stats API image
        uses: docker/build-push-action@v6
        with:
          context: ./stats_api
          file: ./stats_api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-stats-api:${{ github.sha }}

  security-image:
    name: security-image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Show image ref to scan
        run: |
          echo "Trivy image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}"
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Scan Todo API image (high+critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: todo-api-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-sbom-${{ github.sha }}
          path: todo-api-sbom.cdx.json

  self-hosted-smoke:
    name: self-hosted-smoke
    runs-on: self-hosted
    needs: verify
    steps:
      - name: Show runner hostname
        run: hostname

      - name: Show Docker visibility on runner
        run: docker ps -a --filter "name=vm-prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  deploy-vm-prod:
    name: deploy-vm-prod
    runs-on: self-hosted
    needs:
      - build-and-push
      - security-image
      - sbom
      - self-hosted-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load deploy key into SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deployment folder on target
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /srv/todo /srv/todo/grafana/provisioning/datasources /srv/todo/grafana/provisioning/dashboards /srv/todo/grafana/dashboards"

      - name: Upload deployment files
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/compose.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/prometheus.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/prometheus.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/grafana/provisioning/datasources/prometheus.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/grafana/provisioning/datasources/prometheus.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/grafana/provisioning/dashboards/dashboard.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/grafana/provisioning/dashboards/dashboard.yml"
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/grafana/dashboards/todo-api-golden-signals.json \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/grafana/dashboards/todo-api-golden-signals.json"

      - name: Validate target .env file
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            test -f /srv/todo/.env || { echo "Missing /srv/todo/.env on target"; exit 1; }
            grep -q "^DB_USER=" /srv/todo/.env || { echo "Missing DB_USER in /srv/todo/.env"; exit 1; }
            grep -q "^DB_PASSWORD=" /srv/todo/.env || { echo "Missing DB_PASSWORD in /srv/todo/.env"; exit 1; }
            grep -q "^DB_NAME=" /srv/todo/.env || { echo "Missing DB_NAME in /srv/todo/.env"; exit 1; }
            grep -q "^GRAFANA_ADMIN_USER=" /srv/todo/.env || { echo "Missing GRAFANA_ADMIN_USER in /srv/todo/.env"; exit 1; }
            grep -q "^GRAFANA_ADMIN_PASSWORD=" /srv/todo/.env || { echo "Missing GRAFANA_ADMIN_PASSWORD in /srv/todo/.env"; exit 1; }
          '

      - name: Deploy images on vm-prod
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /srv/todo
            TAG=${{ github.sha }} DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose -f compose.yml up -d
          '

      - name: Verify deployment health
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            check_url() {
              url="$1"
              attempts="${2:-20}"
              if command -v curl >/dev/null 2>&1; then
                curl --retry "$attempts" --retry-all-errors --retry-delay 1 --max-time 5 -f "$url" >/dev/null
                return
              fi

              if command -v wget >/dev/null 2>&1; then
                i=1
                until wget -q --spider -T 5 "$url"; do
                  if [ "$i" -ge "$attempts" ]; then
                    echo "Health check failed after $attempts attempts for $url"
                    exit 1
                  fi
                  i=$((i + 1))
                  sleep 1
                done
                return
              fi

              echo "Neither curl nor wget is installed on target host"
              exit 127
            }

            sleep 5

            check_url http://localhost:3000/health 60
            check_url http://localhost:9090/-/healthy 60
            check_url http://localhost:3001/api/health 90

            i=1
            max_attempts=120
            until [ "$i" -gt "$max_attempts" ]; do
              if command -v curl >/dev/null 2>&1; then
                payload="$(curl -fsSG --max-time 5 'http://localhost:9090/api/v1/query' --data-urlencode 'query=up{job="todo-api"}')" || true
              elif command -v wget >/dev/null 2>&1; then
                payload="$(wget -q -T 5 -O- 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22todo-api%22%7D')" || true
              else
                echo "Neither curl nor wget is installed on target host"
                exit 127
              fi

              echo "$payload" | grep -q '"status":"success"' && \
              echo "$payload" | grep -q '"result"' && \
              echo "$payload" | grep -Eq '"value":\[[^]]*,"1"\]' && break

              if [ "$i" -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
                echo "Waiting for Prometheus scrape todo-api (attempt $i/$max_attempts)"
              fi

              i=$((i + 1))
              sleep 1
            done

            if [ "$i" -gt "$max_attempts" ]; then
              echo "Prometheus did not report up{job=\"todo-api\"}=1 in time"
              if command -v curl >/dev/null 2>&1; then
                echo "--- /api/v1/query up{job=\"todo-api\"} ---"
                curl -fsSG --max-time 5 'http://localhost:9090/api/v1/query' --data-urlencode 'query=up{job="todo-api"}' || true
                echo
                echo "--- /api/v1/targets ---"
                curl -fsS --max-time 5 'http://localhost:9090/api/v1/targets' || true
                echo
              elif command -v wget >/dev/null 2>&1; then
                echo "--- /api/v1/query up{job=\"todo-api\"} ---"
                wget -q -T 5 -O- 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22todo-api%22%7D' || true
                echo
                echo "--- /api/v1/targets ---"
                wget -q -T 5 -O- 'http://localhost:9090/api/v1/targets' || true
                echo
              fi

              if docker exec prometheus wget -q --spider -T 5 http://todo-api:3000/metrics; then
                echo "Prometheus direct scrape path is reachable; continuing despite delayed up sample."
              else
                echo "Prometheus cannot reach todo-api:3000/metrics"
                exit 1
              fi
            fi
          '

  release-summary:
    name: release-summary
    runs-on: ubuntu-latest
    needs:
      - verify
      - build-and-push
      - security-image
      - sbom
      - self-hosted-smoke
      - deploy-vm-prod
    if: always()
    steps:
      - name: Publish release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "Image tag: \`${{ github.sha }}\`"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| verify | ${{ needs.verify.result }} |"
            echo "| build-and-push | ${{ needs.build-and-push.result }} |"
            echo "| security-image | ${{ needs.security-image.result }} |"
            echo "| sbom | ${{ needs.sbom.result }} |"
            echo "| self-hosted-smoke | ${{ needs.self-hosted-smoke.result }} |"
            echo "| deploy-vm-prod | ${{ needs.deploy-vm-prod.result }} |"
            echo ""
            echo "SBOM artifact: todo-api-sbom-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"