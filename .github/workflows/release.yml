name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: todo_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Todo API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}

      - name: Build and push Todo Stats API image
        uses: docker/build-push-action@v6
        with:
          context: ./stats_api
          file: ./stats_api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-stats-api:${{ github.sha }}

  security-image:
    name: security-image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Show image ref to scan
        run: |
          echo "Trivy image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}"
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Scan Todo API image (high+critical)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: todo-api-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-sbom-${{ github.sha }}
          path: todo-api-sbom.cdx.json

  self-hosted-smoke:
    name: self-hosted-smoke
    runs-on: self-hosted
    needs: verify
    steps:
      - name: Show runner hostname
        run: hostname

      - name: Show kubectl context and nodes
        run: |
          kubectl config current-context
          kubectl get nodes

  deploy-cluster:
    name: deploy-cluster
    runs-on: self-hosted
    needs:
      - build-and-push
      - security-image
      - sbom
      - self-hosted-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate cluster target
        run: |
          set -e
          kubectl config current-context
          kubectl get ns todo
          kubectl get deployment todo-api -n todo

      - name: Set new image tag on cluster deployment
        run: |
          set -e
          kubectl set image deployment/todo-api -n todo \
            todo-api=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}-does-not-exist

      - name: Wait for rollout convergence
        run: |
          set -e
          kubectl rollout status deployment/todo-api -n todo --timeout=180s

      - name: Verify ingress health after rollout
        run: |
          set -e
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 \
            -fsS -H "Host: todo.localhost" http://localhost:8080/health >/dev/null

  release-summary:
    name: release-summary
    runs-on: ubuntu-latest
    needs:
      - verify
      - build-and-push
      - security-image
      - sbom
      - self-hosted-smoke
      - deploy-cluster
    if: always()
    steps:
      - name: Publish release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "Image tag: \`${{ github.sha }}\`"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| verify | ${{ needs.verify.result }} |"
            echo "| build-and-push | ${{ needs.build-and-push.result }} |"
            echo "| security-image | ${{ needs.security-image.result }} |"
            echo "| sbom | ${{ needs.sbom.result }} |"
            echo "| self-hosted-smoke | ${{ needs.self-hosted-smoke.result }} |"
            echo "| deploy-cluster | ${{ needs.deploy-cluster.result }} |"
            echo ""
            echo "SBOM artifact: todo-api-sbom-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"